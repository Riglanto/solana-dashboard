[project]
name = "solana-dashboard"
version = "0.1.0"
description = "Solana ecosystem auto-updating report & interactive dashboard (Superteam Canada bounty)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "rich>=14.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solana_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
